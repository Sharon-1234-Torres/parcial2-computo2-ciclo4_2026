<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login - Universidad Gerardo Barrios</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css">
</head>
<body class="bg-dark d-flex align-items-center" style="min-height:100vh">
    <div class="container" style="max-width:420px">
        <form id="frmLogin" class="card shadow">
            <div class="card-header text-center fw-bold">::.. INICIAR SESION ..::</div>
            <div class="card-body">
                <div class="mb-3">
                    <label class="form-label" for="txtUsuario">Usuario</label>
                    <input required maxlength="35" id="txtUsuario" class="form-control" type="text" autofocus>
                </div>
                <div class="mb-3">
                    <label class="form-label" for="txtClave">Clave</label>
                    <input required maxlength="35" id="txtClave" class="form-control" type="password">
                </div>
                <div id="msgLogin" class="alert alert-danger d-none py-2"></div>
            </div>
            <div class="card-footer text-center">
                <input type="submit" value="Ingresar" class="btn btn-primary w-100">
            </div>
        </form>
    </div>
    <script>
        frmLogin.addEventListener('submit', async e => {
            e.preventDefault();
            let response = await fetch('/login', {
                method: 'POST',
                headers: {'Content-Type': 'application/json'},
                body: JSON.stringify({modulo: 'login', usuario: txtUsuario.value, clave: txtClave.value})
            }), respuesta = await response.json();
            if (respuesta.msg != 'ok') {
                msgLogin.textContent = respuesta.msg;
                msgLogin.classList.remove('d-none');
                txtClave.value = '';
                return;
            }
            location.href = '/sistema';
        });
    </script>
</body>
</html>
